 .meta{max-width:1440px; margin:0 auto 16px; font-size:12px; color:#6b7280; word-break:break-all}
 .grid{display:grid; grid-template-columns:1fr 1fr; gap:20px; max-width:1440px; margin:0 auto; align-items:start}
 @media(max-width:1024px){.grid{grid-template-columns:1fr}}
 .file-box{border:1px solid #e5e7eb; border-radius:16px; background:white; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,0.04); display:flex; flex-direction:column}
 .file-header{padding:10px 16px; border-bottom:1px solid #f1f2f4; background:#fcfcfc; display:flex; gap:8px; align-items:center; font-size:13px; font-weight:700; flex-wrap:wrap}
 .file-header .badge{font-size:11px; color:#6b7280; font-weight:400; font-family:'JetBrains Mono', monospace}
 .file-content{height:auto; overflow:visible}
 .file-content table{border-collapse:collapse; width:100%; table-layout:fixed}
 .file-content tr{min-height:20px}
 .gutter{width:48px; min-width:48px; background:#f9fafb; border-right:1px solid #e5e7eb; text-align:right; padding:0 8px; color:#9ca3af; font-size:13px; line-height:20px; white-space:nowrap; vertical-align:top; user-select:none}
 .text{padding:0 12px; font-size:13px; line-height:20px; white-space:pre-wrap; word-break:break-all; vertical-align:top; font-family:'JetBrains Mono', monospace; background:white}
 tr.line-del td.gutter{background:#fee2e2}
 tr.line-ins td.gutter{background:#dbeafe}
 tr.line-mod-a td.gutter{background:#fee2e2}
 tr.line-mod-b td.gutter{background:#dbeafe}
 tr td.text{background:white}
 .char-del{background:#fecaca; color:#991b1b; font-weight:700; border-radius:3px; padding:0 2px}
 .char-ins{background:#bfdbfe; color:#1e40af; font-weight:700; border-radius:3px; padding:0 2px}
 .legend{max-width:1440px; margin:12px auto 0; font-size:11px; color:#6b7280; display:flex; gap:12px; flex-wrap:wrap}
 .legend span{display:inline-flex; align-items:center; gap:6px}
 .dot{width:10px; height:10px; border-radius:3px; display:inline-block}

  <script>
  // 案A補完: テキスト内容ボックスは常に左端を表示する（右端は横スクロールバーで確認する）
  //  - コンテンツ変更（ペースト／入力）とカレット移動（キー操作）で自動的に左端へ戻す
  //  - マウス・トラックパッドによる手動スクロールは維持する（scroll では触らない）
  //  - 横スクロールバー分の高さを確保し、ボックス内の縦スクロールバー（二重表示）を防ぐ
  (function(){
    var resize = window.ResizeObserver ? new ResizeObserver(grow) : null;
    var seen = window.WeakSet ? new WeakSet() : null;
    function each(fn){
      var list = document.querySelectorAll('textarea');
      for (var i = 0; i < list.length; i++) fn(list[i]);
    }
    function pin(){
      each(function(ta){
        if (ta.scrollLeft) ta.scrollLeft = 0;
        var box = ta.closest && (ta.closest('.overflow-auto') || (ta.parentElement && ta.parentElement.parentElement));
        if (box && box.scrollLeft) box.scrollLeft = 0;
      });
    }
    // textarea の高さは「テキストの高さちょうど」に設定されるため、横スクロールバーが
    // その分だけ内側（下）を食い、縦に溢れて2本目の縦スクロールバーが出ていた。
    // 横スクロールバーの高さぶんだけ高さを確保して解消する（縦の折り返し・クリップは発生しない）。
    // なお行番号トラックも同じ高さに揃えないと、sticky な行番号が追従しきれずズレるため併せて調整する。
    function grow(){
      each(function(ta){
        var bar = ta.offsetHeight - ta.clientHeight;     // 横スクロールバーの高さ（オーバーレイ表示なら0）
        var wrap = ta.closest && (ta.closest('.overflow-auto') || (ta.parentElement && ta.parentElement.parentElement));
        var track = wrap && wrap.children && wrap.children[0] && wrap.children[0].firstChild;
        if (!bar){ if (track) track.style.minHeight = ''; return; }  // バーが無ければ調整不要

    // 差分表示のボックスには textarea が無いので、編集時に付けた調整を戻す
    function cleanup(){
      var boxes = document.querySelectorAll('.overflow-auto');
      for (var i = 0; i < boxes.length; i++){
        var box = boxes[i];
        if (box.querySelector('textarea')) continue;      // 編集ボックスは grow() が担当
